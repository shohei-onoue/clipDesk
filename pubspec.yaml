name: clipdesk
description: Clip Desk - 動画編集指示書用アプリ
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  video_player: ^2.14.1
  firebase_storage: ^14.0.1
  file_picker: ^13.3.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_cloud_firestore: ^4.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/video_web.mp4
    - assets/voice.mp3
    - assets/navigater.png
    - assets/menu/
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Variable.ttf
          weight: 400
        - asset: assets/fonts/NotoSansJP-Variable.ttf
          weight: 500
        - asset: assets/fonts/NotoSansJP-Variable.ttf
          weight: 700
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Variable.ttf
          weight: 700
