<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <style>
    html, body { background: #1A1D20; touch-action: manipulation; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    /* 背景動画（プラットフォームビュー）が画面全体のタップを奪い、Safariで入力欄にフォーカスできなくなるのを防ぐ */
    flt-platform-view, flt-platform-view *, video { pointer-events: none !important; }
    /* Flutterが最初の画面を描くまでの間、軽い静止画（オープニング動画の1コマ）を出す。 */
    #splash { position: fixed; inset: 0; z-index: 2147483647; background: #1A1D20 url(intro_poster.jpg) center / cover no-repeat; transition: opacity .2s ease-out; }
    #splash::after { content: ''; position: absolute; inset: 0; background: rgba(0, 0, 0, .5); }
  </style>
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="動画編集の依頼・進捗・納品を管理するアプリです。">

  <meta name="theme-color" content="#1A1D20">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Clip Desk">
  <link rel="apple-touch-icon" href="icons/clipdesk-apple-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="clipdesk-favicon.png"/>

  <title>Clip Desk</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="splash" aria-hidden="true"></div>
  <script>
    // Flutterが最初の画面を描いたら静止画を外す（描画が始まらなくても5秒で外す）。
    (function () {
      function hide() {
        var el = document.getElementById('splash');
        if (!el) return;
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 250);
      }
      window.addEventListener('flutter-first-frame', hide, { once: true });
      setTimeout(hide, 5000);
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Safari: pointerdownで入力欄にフォーカスした直後、mousedownの既定動作がフォーカスを奪い返して
    // 入力できなくなる（フォーカスが外れる）ため、mousedownの既定動作を止める。
    window.addEventListener('mousedown', function (e) {
      var t = e.target;
      if (t && (t.tagName === 'FLT-GLASS-PANE' || t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) e.preventDefault();
    }, true);
  </script>
  <script>
    // iOS Safari: Flutterが作る入力欄（input/textarea）に言語や入力属性がないと、
    // 1文字入力するたびにキーボードが日本語（かな）へ戻ることがある。
    // メール・パスワード欄は英字入力にしたいので、作られた入力欄にlang="en"などを付ける。
    (function () {
      // 属性は「値が違うときだけ」書き換える。Flutterは1文字入力するたびに入力欄の属性を
      // 付け直すため、毎回書き換えると、iPhoneがそのたびに入力の設定を読み直して
      // キーボードが日本語（かな）へ戻ってしまう。
      function setIfDiff(el, name, value) {
        if (el.getAttribute(name) !== value) el.setAttribute(name, value);
      }
      function fix(el) {
        if (!el || !el.tagName) return;
        if (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA') return;
        var type = el.getAttribute('type');
        var mode = el.getAttribute('inputmode');
        var ascii = type === 'password' || type === 'email' || mode === 'email';
        if (!ascii) return;
        setIfDiff(el, 'lang', 'en');
        setIfDiff(el, 'autocapitalize', 'none');
        setIfDiff(el, 'autocorrect', 'off');
        setIfDiff(el, 'spellcheck', 'false');
      }
      function scan(node) {
        if (!node || node.nodeType !== 1) return;
        fix(node);
        if (node.querySelectorAll) node.querySelectorAll('input,textarea').forEach(fix);
      }
      // 入力欄が新しく作られたときだけ見る（属性の変化は見ない。自分の書き換えで繰り返し呼ばれないように）。
      new MutationObserver(function (muts) {
        muts.forEach(function (m) {
          m.addedNodes && m.addedNodes.forEach(scan);
        });
      }).observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>
  <script>
    // iOS Safari: 動画は最初のタッチ操作で再生を試みる（自動再生制限の回避）
    (function () {
      function kick() {
        document.querySelectorAll('video').forEach(function (v) {
          v.muted = true; v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
          if (v.paused) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
        });
      }
      ['touchstart', 'touchend', 'pointerdown', 'click'].forEach(function (e) {
        window.addEventListener(e, kick, { capture: true, passive: true });
      });
      setInterval(kick, 1500);
    })();
  </script>
</body>
</html>
