<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <style>
    html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    /* 背景動画（プラットフォームビュー）が画面全体のタップを奪い、Safariで入力欄にフォーカスできなくなるのを防ぐ */
    flt-platform-view, flt-platform-view *, video { pointer-events: none !important; }
  </style>
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="clipdesk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>clipdesk</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // iOS Safari: 動画は最初のタッチ操作で再生を試みる（自動再生制限の回避）
    (function () {
      function kick() {
        document.querySelectorAll('video').forEach(function (v) {
          v.muted = true; v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
          if (v.paused) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
        });
      }
      ['touchstart', 'touchend', 'pointerdown', 'click'].forEach(function (e) {
        window.addEventListener(e, kick, { capture: true, passive: true });
      });
      setInterval(kick, 1500);
    })();
  </script>
</body>
</html>
