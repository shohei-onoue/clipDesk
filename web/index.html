<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <style>
    html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    /* 背景動画（プラットフォームビュー）が画面全体のタップを奪い、Safariで入力欄にフォーカスできなくなるのを防ぐ */
    flt-platform-view, flt-platform-view *, video { pointer-events: none !important; }
  </style>
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="clipdesk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>clipdesk</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Mac等のSafari: pointerdownで入力欄にフォーカスした直後、mousedownの既定動作がフォーカスを奪い返すため止める。
    // タッチ端末（iPhone/iPad）では止めると、タップでの入力欄フォーカスとキーボード表示を妨げるため何もしない。
    (function () {
      if (navigator.maxTouchPoints > 0) return;
      window.addEventListener('mousedown', function (e) {
        var t = e.target;
        if (t && t.tagName === 'FLT-GLASS-PANE') e.preventDefault();
      }, true);
    })();
  </script>
  <script>
    // iOS Safari: 背景動画（ループ再生の動画）は、自動再生が止められたらタップ時に再生する。
    // ・定期的な再生（setInterval）はしない：音声入力中にメディア再生が割り込み、画面が固まる原因になる。
    // ・入力欄にフォーカス中は何もしない：キーボード表示・音声入力を妨げない。
    // ・ループでない動画/音声（エラー音声、納品動画など）には触らない。
    (function () {
      function typing() {
        var a = document.activeElement;
        return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable);
      }
      function kick() {
        if (typing()) return;
        document.querySelectorAll('video').forEach(function (v) {
          if (!v.loop) return;
          v.muted = true; v.setAttribute('playsinline', '');
          if (v.paused) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
        });
      }
      ['touchend', 'click'].forEach(function (e) {
        window.addEventListener(e, kick, { capture: true, passive: true });
      });
    })();
  </script>
</body>
</html>
